<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>TrainVault</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 16px;background:#111827;border-bottom:1px solid #334155}h1{margin:0}.sub,.muted{color:#94a3b8;font-size:13px}main{max-width:800px;margin:auto;padding:14px 14px 90px}.card{background:#172033;border:1px solid #334155;border-radius:16px;padding:14px;margin-bottom:12px}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}.stat{text-align:center;background:#0b1220;padding:10px 4px;border-radius:12px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#94a3b8}label{display:block;color:#94a3b8;font-size:12px;margin:3px 0 5px}input,select,textarea{width:100%;padding:12px;font-size:16px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:white}textarea{min-height:75px}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;background:#38bdf8;color:#062033}.secondary{background:#334155;color:white}.good{background:#22c55e}.warn{background:#f59e0b}.danger{background:#ef4444;color:white}.hidden{display:none}.item{padding:12px 0;border-top:1px solid #334155}.row{display:flex;justify-content:space-between;gap:10px}.thumb{width:65px;height:65px;object-fit:cover;border-radius:8px}.tag{display:inline-block;background:#7c2d12;color:#fed7aa;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;margin-top:4px}.value{color:#86efac;font-weight:800}#reader{background:white;border-radius:12px;overflow:hidden}nav{position:fixed;bottom:0;left:0;right:0;padding:9px;background:#0b1220;border-top:1px solid #334155;display:flex;gap:8px}nav button{flex:1}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header><h1>🚂 TrainVault</h1><div class="sub">Lionel collection inventory & value helper</div></header><main>
<section id="list"><div class="card"><div class="stats"><div class="stat"><b id="cnt">0</b><span>ITEMS</span></div><div class="stat"><b id="val">$0</b><span>TYPICAL VALUE</span></div><div class="stat"><b id="flg">0</b><span>COLLECTOR FLAGS</span></div></div><div class="btns"><button onclick="fresh()">📷 Scan / Add Train</button><button class="secondary" onclick="csv()">Export CSV</button></div></div><div class="card"><input id="search" placeholder="Search inventory…" oninput="render()"><div id="items"></div></div></section>
<section id="edit" class="hidden"><div class="card"><div class="row"><div><b id="ttl">Add Train</b><div class="muted">Scan the box, then verify the model.</div></div><button class="secondary" onclick="back()">Back</button></div><div class="btns"><button onclick="scan()">📷 Scan Barcode</button><button class="secondary" onclick="stop()">Stop Camera</button></div><div id="rw" class="hidden"><div id="reader"></div></div></div>
<div class="card grid"><div><label>Barcode / UPC</label><input id="barcode" inputmode="numeric"></div><div><label>Lionel Model / Item #</label><input id="model" placeholder="6-XXXXX"></div><div class="full"><label>Description</label><input id="desc"></div><div><label>Brand</label><input id="brand" value="Lionel"></div><div><label>Quantity</label><input id="qty" type="number" value="1" min="1"></div><div><label>Condition</label><select id="condition"><option>New / Sealed</option><option>New in Box - Opened</option><option selected>Excellent</option><option>Good</option><option>Fair</option><option>Poor / Parts</option></select></div><div><label>Packaging</label><select id="box"><option selected>Original box</option><option>Box worn/damaged</option><option>No box</option><option>Unknown</option></select></div><div><label>Low Sold Value ($)</label><input id="low" type="number"></div><div><label>Typical Sold Value ($)</label><input id="typical" type="number"></div><div><label>High Sold Value ($)</label><input id="high" type="number"></div><div><label>Collector Status</label><select id="collector"><option value="no">Normal / Unknown</option><option value="review">Potential collector item — REVIEW</option><option value="yes">Confirmed collector item</option></select></div><div class="full"><label>Notes</label><textarea id="notes"></textarea></div><div class="full"><label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment"></div><div class="full muted">For older Lionel pieces, use the exact model number and photos when possible. Sold listings are more useful than asking prices.</div><div class="full btns"><button class="secondary" onclick="web()">Search Web</button><button class="warn" onclick="ebay()">eBay Sold Comps</button><button class="good" onclick="save()">Save Train</button></div></div></section></main><nav><button onclick="back()">Inventory</button><button onclick="fresh()">＋ Add Train</button></nav>
<script>
let d=JSON.parse(localStorage.getItem("trainvault-v2")||"[]"),editing=null,scanner=null,pic="";const $=x=>document.getElementById(x),fs=["barcode","model","desc","brand","qty","condition","box","low","typical","high","collector","notes"];function store(){localStorage.setItem("trainvault-v2",JSON.stringify(d))}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function money(v){return "$"+(Number(v)||0).toLocaleString()}function back(){stop();$("edit").classList.add("hidden");$("list").classList.remove("hidden");render()}function fresh(){editing=null;pic="";fs.forEach(k=>$(k).value="");$("brand").value="Lionel";$("qty").value=1;$("condition").value="Excellent";$("box").value="Original box";$("collector").value="no";$("ttl").textContent="Add Train";$("list").classList.add("hidden");$("edit").classList.remove("hidden")}function ed(id){let x=d.find(a=>a.id===id);editing=id;pic=x.pic||"";fs.forEach(k=>$(k).value=x[k]??"");$("ttl").textContent="Edit Train";$("list").classList.add("hidden");$("edit").classList.remove("hidden")}function save(){let x={id:editing||Date.now(),pic};fs.forEach(k=>x[k]=$(k).value);if(!x.barcode&&!x.model&&!x.desc)return alert("Scan a barcode or enter a model/description.");if(editing)d[d.findIndex(a=>a.id===editing)]=x;else d.unshift(x);store();back()}function rm(id){if(confirm("Delete this train?")){d=d.filter(x=>x.id!==id);store();render()}}function render(){let q=$("search").value.toLowerCase(),a=d.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$("cnt").textContent=d.reduce((s,x)=>s+(+x.qty||1),0);$("val").textContent=money(d.reduce((s,x)=>s+(+x.typical||0)*(+x.qty||1),0));$("flg").textContent=d.filter(x=>x.collector!="no").length;$("items").innerHTML=a.length?a.map(x=>`<div class="item"><div class="row"><div style="display:flex;gap:9px">${x.pic?`<img class="thumb" src="${x.pic}">`:""}<div><b>${esc(x.desc||x.model||x.barcode)}</b><div class="muted">${esc(x.brand)} ${x.model?"• "+esc(x.model):""}</div><div class="muted">${esc(x.condition)} • Qty ${esc(x.qty)}</div>${x.collector!="no"?'<span class="tag">★ COLLECTOR REVIEW</span>':""}</div></div><div class="value">${money((+x.typical||0)*(+x.qty||1))}</div></div><div class="btns"><button class="secondary" onclick="ed(${x.id})">Edit</button><button class="danger" onclick="rm(${x.id})">Delete</button></div></div>`).join(""):'<div class="muted" style="padding:20px 0">No trains yet. Tap “Scan / Add Train” to begin.</div>'}
$("photo").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=a=>{let im=new Image();im.onload=()=>{let c=document.createElement("canvas"),s=Math.min(1,700/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pic=c.toDataURL("image/jpeg",.6)};im.src=a.target.result};r.readAsDataURL(f)}
function query(){return [$("brand").value,$("model").value,$("desc").value,$("barcode").value].filter(Boolean).join(" ")}function web(){open("https://www.google.com/search?q="+encodeURIComponent(query()),"_blank")}function ebay(){open("https://www.ebay.com/sch/i.html?_nkw="+encodeURIComponent(query())+"&LH_Sold=1&LH_Complete=1","_blank")}
async function scan(){if(typeof Html5Qrcode==="undefined")return alert("Scanner library did not load.");$("rw").classList.remove("hidden");if(scanner)return;scanner=new Html5Qrcode("reader");try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:280,height:140}},t=>{$("barcode").value=t;navigator.vibrate?.(100);stop()},()=>{})}catch(e){scanner=null;alert("Camera could not start. Allow camera access for this site in Safari.")}}async function stop(){if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null}$("rw").classList.add("hidden")}
function csv(){let ks=["brand","model","barcode","desc","condition","box","qty","low","typical","high","collector","notes"],r=[ks,...d.map(x=>ks.map(k=>x[k]||""))],s=r.map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download="TrainVault_Inventory.csv";a.click()}render();
</script></body></html>
